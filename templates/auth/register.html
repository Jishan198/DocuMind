{% extends 'base.html' %}
{% block title %}Create workspace — DocuMind{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;margin:-40px -48px;background:var(--bg-base);">
    <div style="width:100%;max-width:440px;padding:0 24px;">

        <div style="text-align:center;margin-bottom:40px;">
            <div style="display:inline-flex;align-items:center;gap:10px;margin-bottom:20px;">
                <div style="width:40px;height:40px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:white;">D</div>
                <span style="font-size:22px;font-weight:700;color:var(--text-primary);">Docu<span style="color:var(--accent-light);">Mind</span></span>
            </div>
            <h1 style="font-size:26px;font-weight:700;letter-spacing:-0.5px;color:var(--text-primary);margin-bottom:8px;">Create your workspace</h1>
            <p style="color:var(--text-secondary);font-size:14px;">Set up your organization in seconds</p>
        </div>

        <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:16px;padding:32px;">
            {% if error %}
            <div class="alert alert-error">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'register_view' %}">
                {% csrf_token %}
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-input" placeholder="johndoe" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Organization</label>
                        <input type="text" name="org_name" class="form-input" placeholder="Acme Inc" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Work email</label>
                    <input type="email" name="email" class="form-input" placeholder="you@company.com" required>
                </div>
                <div class="form-group" style="margin-bottom:24px;">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="Min. 8 characters" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;">
                    Create workspace
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                </button>
            </form>
        </div>

        <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted);">
            Already have a workspace?
            <a href="{% url 'login_view' %}" style="color:var(--accent-light);text-decoration:none;font-weight:500;"> Sign in →</a>
        </p>
    </div>
</div>
{% endblock %}
