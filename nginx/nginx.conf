upstream documind_web {
    server web:8000;
}

server {
    listen 80;

    # Increase max upload size for documents
    client_max_body_size 50M;

    location / {
        proxy_pass http://documind_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support for Django Channels
    location /ws/ {
        proxy_pass http://documind_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Prevent idle WebSockets from disconnecting quickly
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Serve static files gathered by Django
    location /static/ {
        alias /app/staticfiles/;
    }

    # Serve user-uploaded media files
    location /media/ {
        alias /app/media/;
    }
}
